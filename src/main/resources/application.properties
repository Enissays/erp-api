spring.application.name=erp-api
spring.datasource.username=erp
spring.datasource.password=erp_erp_erp
spring.r2dbc.url=r2dbc:postgresql://postgresdb:5432/erp_db
spring.r2dbc.username=erp
spring.r2dbc.password=erp_erp_erp
spring.main.allow-bean-definition-overriding=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database = postgresql
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.security=ERROR
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Niveau global de log
logging.level.root=INFO

# Niveau de log spécifique pour votre package
logging.level.com.est.erp_api=DEBUG

# Configurer la sortie des logs (console, fichier, etc.)
logging.file.name=logs/erp_api.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
