spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 2MB
  r2dbc:
    url: r2dbc:postgresql://postgresdb:5432/erp_db
    username: erp
    password: erp_erp_erp

  main:
    banner-mode: off # Désactive l'affichage de la bannière Spring Boot au démarrage

logging:
  level:
    org:
      springframework:
        r2dbc: DEBUG # Active le logging au niveau DEBUG pour les opérations R2DBC
        security: ERROR
        web: ERROR

